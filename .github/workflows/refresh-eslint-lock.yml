name: Refresh eslint-config lockfile

on:
  push:
    branches:
      - chore/eslint-config-0.2.2

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/eslint-config-0.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: yarn install --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): 🔒 Refresh eslint-config lockfile"
          git push origin HEAD:chore/eslint-config-0.2.2
